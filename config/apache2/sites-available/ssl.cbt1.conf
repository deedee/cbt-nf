<IfModule mod_ssl.c>
	<VirtualHost _default_:443>
		ServerAdmin webmaster@localhost

		DocumentRoot /var/www/html/cbt1


		ErrorLog ${APACHE_LOG_DIR}/error1.log
		CustomLog ${APACHE_LOG_DIR}/access1.log combined


		SSLEngine on

		SSLCertificateFile	/etc/letsencrypt/live/cbt1.nf-pdg.web.id/cert.pem
		SSLCertificateChainFile	/etc/letsencrypt/live/cbt1.nf-pdg.web.id/fullchain.pem
		SSLCertificateKeyFile	/etc/letsencrypt/live/cbt1.nf-pdg.web.id/privkey.pem





		<FilesMatch "\.(cgi|shtml|phtml|php)$">
				SSLOptions +StdEnvVars
		</FilesMatch>
		<Directory /usr/lib/cgi-bin>
				SSLOptions +StdEnvVars
		</Directory>


	</VirtualHost>
</IfModule>

